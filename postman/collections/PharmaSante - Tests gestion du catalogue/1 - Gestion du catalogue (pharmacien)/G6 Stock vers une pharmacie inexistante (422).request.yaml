$kind: http-request
url: "{{base_url}}/api/gestion/stocks"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{token_pharmacien}}
body:
  type: json
  content: |-
    {
      "pharmacie_id": 999999,
      "medicament_id": "{{medicament_id}}",
      "quantite": 5
    }
scripts:
  - type: afterResponse
    code: pm.test('Pharmacie inconnue refusee (422)',()=>pm.response.to.have.status(422));
    language: text/javascript
order: 6000
