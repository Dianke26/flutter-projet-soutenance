$kind: http-request
url: "{{base_url}}/api/gestion/stocks"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{token_pharmacien}}
body:
  type: json
  content: |-
    {
      "pharmacie_id": "{{pharmacie_id}}",
      "medicament_id": "{{medicament_id}}",
      "quantite": 25
    }
scripts:
  - type: afterResponse
    code: pm.test('Stock enregistre (200)',()=>pm.response.to.have.status(200));
    language: text/javascript
order: 5000
