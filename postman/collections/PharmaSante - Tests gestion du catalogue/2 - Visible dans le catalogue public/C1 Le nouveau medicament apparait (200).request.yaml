$kind: http-request
url: "{{base_url}}/api/medicaments"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Catalogue (200)',()=>pm.response.to.have.status(200));
      const id=Number(pm.collectionVariables.get('medicament_id'));
      pm.test('Medicament visible avec son stock',()=>{const m=pm.response.json().find(x=>Number(x.id)===id);pm.expect(m).to.exist;pm.expect(Number(m.stock)).to.eql(25);});
    language: text/javascript
order: 1000
