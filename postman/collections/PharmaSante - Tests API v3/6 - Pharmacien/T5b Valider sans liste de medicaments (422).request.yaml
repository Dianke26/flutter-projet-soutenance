$kind: http-request
url: "{{base_url}}/api/ordonnances/{{ordonnance_id}}/valider"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{token_pharmacien}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 422', function(){ pm.response.to.have.status(422); });
    language: text/javascript
order: 3000
