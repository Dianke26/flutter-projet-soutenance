$kind: http-request
url: "{{base_url}}/api/ordonnances"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_pharmacien}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 200', function(){ pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
