$kind: http-request
url: "{{base_url}}/api/ordonnances/{{ordonnance_id}}/valider"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "medicaments": [ { "medicament_id": "{{medicament_ordonnance_id}}", "quantite": 2 } ]
    }
auth:
  type: bearer
  credentials:
    token: "{{token_pharmacien}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Statut 200', function(){ pm.response.to.have.status(200); });
      pm.test('Statut VALIDEE', function(){ pm.expect(pm.response.json().statut).to.eql('VALIDEE'); });
    language: text/javascript
order: 2000
