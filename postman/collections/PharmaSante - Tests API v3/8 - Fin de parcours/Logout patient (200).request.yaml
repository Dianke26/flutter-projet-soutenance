$kind: http-request
url: "{{base_url}}/api/logout"
method: POST
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_patient}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 200', function(){ pm.response.to.have.status(200); });
    language: text/javascript
order: 2000
