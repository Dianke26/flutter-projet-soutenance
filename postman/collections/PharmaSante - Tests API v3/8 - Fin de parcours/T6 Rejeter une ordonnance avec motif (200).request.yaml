$kind: http-request
url: "{{base_url}}/api/ordonnances/{{ordonnance_id}}/rejeter"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "motif": "Image floue"
    }
auth:
  type: bearer
  credentials:
    token: "{{token_pharmacien}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Statut 200', function(){ pm.response.to.have.status(200); });
      pm.test('Statut REJETEE', function(){ pm.expect(pm.response.json().statut).to.eql('REJETEE'); });
    language: text/javascript
order: 1000
