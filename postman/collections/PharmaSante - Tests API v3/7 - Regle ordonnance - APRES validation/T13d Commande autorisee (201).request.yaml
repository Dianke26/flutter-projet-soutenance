$kind: http-request
url: "{{base_url}}/api/commande"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "adresse_livraison": "Dakar",
      "lignes": [ { "medicament_id": "{{medicament_ordonnance_id}}", "quantite": 1 } ]
    }
auth:
  type: bearer
  credentials:
    token: "{{token_patient}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 201', function(){ pm.response.to.have.status(201); });
    language: text/javascript
order: 3000
