$kind: http-request
name: T9 Profil /me (patient)
url: "{{base_url}}/api/me"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_patient}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 200', function(){ pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
