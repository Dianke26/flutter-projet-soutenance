$kind: http-request
url: "{{base_url}}/api/commande/verifier"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "lignes": [ { "medicament_id": "{{medicament_ordonnance_id}}", "quantite": 1 } ]
    }
auth:
  type: bearer
  credentials:
    token: "{{token_patient}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Statut 422', function(){ pm.response.to.have.status(422); });
      var j = pm.response.json();
      pm.test('Code metier attendu : ORDONNANCE_EN_ATTENTE ou MEDICAMENT_NON_AUTORISE ou AUCUNE_ORDONNANCE', function(){ pm.expect(["ORDONNANCE_EN_ATTENTE", "MEDICAMENT_NON_AUTORISE", "AUCUNE_ORDONNANCE"]).to.include(j.code); });
    language: text/javascript
order: 2000
