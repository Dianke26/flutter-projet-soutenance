$kind: http-request
url: "{{base_url}}/api/commande/verifier"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "lignes": [ { "medicament_id": "{{medicament_libre_id}}", "quantite": 1 } ]
    }
auth:
  type: bearer
  credentials:
    token: "{{token_patient}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 200', function(){ pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
