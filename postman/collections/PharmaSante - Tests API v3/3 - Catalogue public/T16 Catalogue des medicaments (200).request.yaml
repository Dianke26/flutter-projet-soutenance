$kind: http-request
url: "{{base_url}}/api/medicaments"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Statut 200', function(){ pm.response.to.have.status(200); });
      pm.test('Liste non vide', function(){ pm.expect(pm.response.json().length).to.be.above(0); });
    language: text/javascript
order: 1000
