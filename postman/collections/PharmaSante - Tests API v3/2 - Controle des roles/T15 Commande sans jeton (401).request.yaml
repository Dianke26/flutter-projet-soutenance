$kind: http-request
url: "{{base_url}}/api/commande"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "adresse_livraison": "Dakar",
      "lignes": [ { "medicament_id": "{{medicament_libre_id}}", "quantite": 1 } ]
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Statut 401', function(){ pm.response.to.have.status(401); });
    language: text/javascript
order: 3000
